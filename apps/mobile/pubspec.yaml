name: mobile
description: "Desafio Pago App"

publish_to: 'none'

version: 2.3.0+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 FIREBASE
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # 🔥 LOGIN GOOGLE
  google_sign_in: ^7.2.0

  # 🔥 CLOUD FUNCTIONS
  cloud_functions: ^6.3.1

  # 🔥 STORAGE (UPLOAD DE IMAGEM/VÍDEO)
  firebase_storage: ^13.4.1

  # 🔥 PUSH NOTIFICATIONS
  firebase_messaging: ^16.2.2

  # 🔒 SCREEN PROTECTION
  screen_protector: ^1.5.1

  # 🔥 IMAGE PICKER
  image_picker: ^1.1.2

  # ✂️ RECORTE DE IMAGEM (cropper — Flutter puro, funciona na web)
  crop_your_image: ^2.0.0

  # 🔥 VÍDEO (preview que toca no hover)
  video_player: ^2.9.2

  # 🔥 UUID (IMPORTANTE PRO DESAFIO)
  uuid: ^4.4.0

  # 🌍 INTERNACIONALIZAÇÃO (datas em pt_BR)
  intl: ^0.20.2

  # 🌐 WEB INTEROP (download de arquivos no navegador)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google.png
    - assets/images/2.png
    - assets/images/logo_icon.png
    - assets/images/logo_stacked.png
    - assets/images/logo_anim_h_light.gif
    - assets/images/logo_anim_h_dark.gif
    - assets/images/logo_anim_sq_light.gif
    - assets/images/logo_anim_sq_dark.gif